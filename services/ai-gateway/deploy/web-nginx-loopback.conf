# Managed by MILO web-install-loopback.py. This is a private preview, not a public site.
limit_req_zone $binary_remote_addr zone=milo_web_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=milo_web_connections:10m;

server {
    listen 127.0.0.1:8080;
    server_name milomood.xyz www.milomood.xyz localhost;
    root /opt/milo-web/current;
    index index.html;
    server_tokens off;

    # Diary text belongs in JSON bodies. Do not retain request URLs or bodies here.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 15s;
    send_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_buffering off;
    }

    location ~ ^/api/v1/recall/(open|respond|diary)$ {
        limit_except POST { deny all; }
        if ($args != "") { return 400; }
        limit_req zone=milo_web_api burst=10 nodelay;
        limit_req_status 429;
        limit_conn milo_web_connections 5;
        limit_conn_status 429;
        rewrite ^/api(/v1/recall/(open|respond|diary))$ $1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Created on the server from gateway.env; never copy this include into a release.
        include /etc/nginx/milo-private/gateway-auth.conf;
        # Ignore visitor-supplied forwarding and request-ID headers.
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api { return 404; }
    location /api/ { return 404; }
    location ~ /\. { deny all; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
