# Managed by MILO native-api-install.py. API host only; no upstream credentials here.
limit_req_zone $binary_remote_addr zone=milo_native_ip_rate:10m rate=60r/m;
limit_req_zone $server_name zone=milo_native_total_rate:1m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=milo_native_ip_connections:10m;
limit_conn_zone $server_name zone=milo_native_total_connections:1m;

server {
    listen 80;
    server_name milomood.xyz;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    if ($host != milomood.xyz) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        if ($request_method != GET) { return 405; }
        root /var/lib/milo-acme;
        try_files $uri =404;
    }
    location / { return 308 https://milomood.xyz$request_uri; }
}

# BEGIN TLS: omitted by the installer in --bootstrap mode.
server {
    listen 443 ssl http2;
    server_name milomood.xyz;
    ssl_certificate /etc/letsencrypt/live/milomood.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milomood.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:milo_native_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    if ($host != milomood.xyz) { return 444; }
    if ($ssl_server_name != milomood.xyz) { return 444; }

    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 15s;
    send_timeout 30s;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Preserve the caller credential. Discard caller-supplied proxy identity headers.
    proxy_http_version 1.1;
    proxy_set_header Host milomood.xyz;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host milomood.xyz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 35s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;

    location = /health {
        if ($request_method != GET) { return 405; }
        if ($request_uri ~ "[?]") { return 400; }
        # Temporary product pause. Keep credentials and the upstream intact.
        default_type application/json;
        return 200 '{"ok":true,"aiEnabled":false,"aiStatus":"paused"}';
    }

    location ~ ^/v1/recall/(open|respond|diary)$ {
        if ($request_method != POST) { return 405; }
        if ($request_uri ~ "[?]") { return 400; }
        # Stop old installed clients too; never forward billable requests.
        default_type application/json;
        return 503 '{"code":"AI_DISABLED","message":"AI is temporarily unavailable. Local journaling remains available.","retryable":false}';
        # No burst: reject excess requests instead of accumulating billable work.
        limit_req zone=milo_native_ip_rate;
        limit_req zone=milo_native_total_rate;
        limit_req_status 429;
        limit_conn milo_native_ip_connections 5;
        limit_conn milo_native_total_connections 5;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8787;
    }

    location / { return 404; }
}
