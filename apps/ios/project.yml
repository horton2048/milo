name: Milo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
packages:
  MiloCore:
    path: MiloCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Milo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: MiloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milo.echoes.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MILO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  MiloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Milo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milo.echoes.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Milo
schemes:
  Milo:
    build:
      targets:
        Milo: all
        MiloUITests: [test]
    test:
      gatherCoverageData: true
      targets: [MiloUITests]
