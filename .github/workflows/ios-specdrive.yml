name: iOS Specdrive pilot

on:
  push:
    branches: ['codex/ios-specdrive-pilot']
    paths: ['apps/ios/**', 'openspec/**', '.agents/skills/specdrive/**', '.github/workflows/ios-specdrive.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-specdrive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-verification:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned planning CLI
        run: npm ci --prefix apps/ios --ignore-scripts
      - name: Test visual review receipt validation
        run: node --test apps/ios/scripts/await-review.test.mjs
      - name: Record environment
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcodebuild -version
          swift --version
          xcrun simctl list devices available
      - name: Verify through Specdrive
        id: verify
        continue-on-error: true
        run: |
          node .agents/skills/specdrive/scripts/specdrive.mjs init apps/ios/specdrive.config.json --project . --state apps/ios/.specdrive/ci
          node .agents/skills/specdrive/scripts/specdrive.mjs run apps/ios/.specdrive/ci
      - name: Determine native check outcome
        id: native
        if: always()
        run: |
          node -e 'const fs=require("node:fs"); const file="apps/ios/.specdrive/ci/report.json"; const r=fs.existsSync(file)?JSON.parse(fs.readFileSync(file)):null; const required=["specification","framework-tests","portable-core","xcode-environment","ios-build","ios-ui"]; console.log("passed="+required.every(id=>r?.checks?.find(c=>c.id===id)?.status==="passed"));' >> "$GITHUB_OUTPUT"
      - name: Export simulator screenshots
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('apps/ios/evidence')
          for result in root.glob('ui-test-*.xcresult'):
              # Export all retained attachments, including successful .keepAlways screenshots.
              # Do not add --only-failures: the reviewer needs the passing accessibility views.
              subprocess.run(['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(result), '--output-path', str(root / 'screenshots')], check=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-specdrive-evidence
          path: |
            apps/ios/.specdrive/ci
            apps/ios/evidence
          include-hidden-files: true
          retention-days: 14
      - name: Wait for this run's independent screenshot review
        id: review
        if: steps.native.outputs.passed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/ios/scripts/await-review.mjs
      - name: Resume the same Specdrive run with reviewed evidence
        if: steps.review.outcome == 'success'
        run: node .agents/skills/specdrive/scripts/specdrive.mjs run apps/ios/.specdrive/ci
      - name: Enforce the complete Specdrive gate
        if: always()
        run: node .agents/skills/specdrive/scripts/specdrive.mjs gate apps/ios/.specdrive/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-specdrive-final-evidence
          path: |
            apps/ios/.specdrive/ci
            apps/ios/evidence
          include-hidden-files: true
          retention-days: 14
